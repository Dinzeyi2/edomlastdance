# Optional local infra: real Postgres + Redis, for anyone who wants to run
# closer to production instead of the zero-config SQLite + eager-Celery
# defaults (see README "Local development"). Not required to run the app or
# test suite.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: roofai
      POSTGRES_PASSWORD: roofai
      POSTGRES_DB: roofai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
