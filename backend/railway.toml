# Railway service config. In the Railway dashboard, set this service's
# "Root Directory" to `backend` so Railway finds this file, the Dockerfile,
# and the build context in the right place -- see README.md "Deploy to
# Railway" for the full walkthrough.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
